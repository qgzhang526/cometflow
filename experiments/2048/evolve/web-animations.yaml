schema: cometflow.evolution.v1
name: web-animations
summary: 网页版动画（G7）：滑动/合并/生成动画，纯视觉层，不改引擎逻辑；59 测试全绿
risk_plan: 仅改 src/web/ui.ts 与 web/index.html CSS，不改 core/ai；DOM stub 冒烟覆盖动画路径
gates:
  - name: typecheck
    command: node
    args:
      - ../../node_modules/typescript/bin/tsc
      - -p
      - tsconfig.json
      - --noEmit
  - name: tests
    command: node
    args:
      - ../../node_modules/vitest/vitest.mjs
      - run
  - name: benchmark
    command: node
    args:
      - ../../node_modules/tsx/dist/cli.mjs
      - src/cli/bin.ts
      - benchmark
      - --n
      - "20"
      - --seed
      - "1"
      - --depth
      - "0"
  - name: web-build
    command: node
    args:
      - scripts/build-web.mjs
status: ready-for-review
