schema: cometflow.evolution.v1
name: web-ai-demo
summary: 网页版 AI 自动演示（G8）：点击按钮 AI 自动下棋，可随时手动接管；60 测试全绿
risk_plan: 仅改 src/web/ui.ts 与 index.html，不改 core/ai；演示间隔 150ms，键盘/滑动/重开/提示均会打断
gates:
  - name: typecheck
    command: node
    args:
      - ../../node_modules/typescript/bin/tsc
      - -p
      - tsconfig.json
      - --noEmit
  - name: tests
    command: node
    args:
      - ../../node_modules/vitest/vitest.mjs
      - run
  - name: benchmark
    command: node
    args:
      - ../../node_modules/tsx/dist/cli.mjs
      - src/cli/bin.ts
      - benchmark
      - --n
      - "20"
      - --seed
      - "1"
      - --depth
      - "0"
  - name: web-build
    command: node
    args:
      - scripts/build-web.mjs
status: ready-for-review
created_at: 2026-09-02T02:29:26.964Z
updated_at: 2026-09-02T02:29:52.177Z
